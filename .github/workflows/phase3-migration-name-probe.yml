name: Phase 3 migration filename probe

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  migration-filename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate canonical migration filename
        run: |
          supabase --help >/dev/null
          supabase migration new customer_privacy_account_requirements
          find supabase/migrations -maxdepth 1 -type f -name '*_customer_privacy_account_requirements.sql' -printf '%f\n'
