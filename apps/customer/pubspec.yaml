name: aida_customer
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  qr_flutter: ^4.1.0
  clock: ^1.1.2
  # Pinned because later 2.16.x releases raise the Dart SDK floor above this
  # app's current 3.7 baseline. Regenerate pubspec.lock with Flutter tooling.
  supabase_flutter: 2.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.15

flutter:
  uses-material-design: true

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf

  assets:
    - assets/images/coffee_cup.png
    - assets/images/auth_coffee_beans.png
    - assets/images/auth_barista.png
    - assets/images/cat_coffee.png
    - assets/images/cat_iced.png
    - assets/images/cat_food.png
    - assets/images/cat_addons.png
